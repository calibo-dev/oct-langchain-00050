[project]
name = "latest-ai-development"
version = "0.1.0"
description = "LangChain workflow template for configuration-driven data queries"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
  "langchain>=1.3,<2",
  "langchain-core>=1.4,<2",
  "langchain-openai>=1.3,<2",
  "langchain-ollama>=1.1,<2",
  "langchain-aws>=1.0,<2",
  "fastapi>=0.115.8",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "boto3>=1.37.0",
  "httpx>=0.27.0",
  # Compatibility utilities
  "typing-extensions>=4.12.0",
  "azure-identity>=1.25.1",
  "azure-keyvault-secrets>=4.10.0",
  "langchain-anthropic>=1.4.8",
  "langchain-google-genai>=4.2.6",
  "snowflake-connector-python>=3.12,<4",
  "opentelemetry-api>=1.44.0",
]

[project.optional-dependencies]

dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.7",
  "mypy>=1.15.0"
]

[project.scripts]
latest_ai_development = "latest_ai_development.main:run"
train = "latest_ai_development.main:train"
replay = "latest_ai_development.main:replay"
test = "latest_ai_development.main:test"
run_with_trigger = "latest_ai_development.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latest_ai_development"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
strict = false
