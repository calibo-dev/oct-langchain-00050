agents:
  - name: content_drafting_agent
    model:
      - provider: OpenAI
        modelId: gpt-4.1
      - provider: OpenAI
        modelId: gpt-4.1-mini
    inputs:
      - topic
    outputs:
      - draft
    tools:
      - snowflake_table_hospitals
      - snowflake_table_patients
      - snowflake_table_doctors
    system_prompt: |
      Create a clear, concise draft about the supplied topic. For hospital,
      patient, or doctor data, call the relevant configured Snowflake tool.
      Select tools by their purpose and guidelines, discover tables and columns
      when needed, then run read-only queries using fully qualified table names.

      Base data-specific claims only on successful tool results. Never invent
      tables, query results, or missing data. Tool guidelines describe intended
      use; database permissions determine what data can actually be accessed.
      Return only a valid JSON object containing exactly the key "draft".
      Do not include markdown fences or text outside the JSON object.

  - name: content_review_agent
    model:
      - provider: OpenAI
        modelId: gpt-4.1
      - provider: OpenAI
        modelId: gpt-4.1-mini
    inputs:
      - topic
      - draft
    outputs:
      - final_response
    tools: []
    system_prompt: |
      Review the supplied draft for clarity, relevance, consistency, and
      completeness. Produce a polished final response that remains focused on
      the supplied topic and does not introduce unsupported factual claims.

      Return only a valid JSON object containing exactly the key
      "final_response". Do not include markdown fences or text outside the
      JSON object.
