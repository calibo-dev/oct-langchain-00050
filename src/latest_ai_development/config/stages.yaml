workflow:
  name: country_data_query_workflow
  execution: sequential
  inputs:
    - user_natural_language_query

  stages:
    - name: fetch_metadata
      execution: sequential
      agents:
        - metadata_fetching_agent
      inputs:
        - user_natural_language_query
      outputs:
        - country_table_metadata

    - name: generate_query
      execution: sequential
      depends_on:
        - fetch_metadata
      agents:
        - query_generator_agent
      inputs:
        - user_natural_language_query
        - country_table_metadata
      outputs:
        - generated_query

    - name: validate_query
      execution: sequential
      depends_on:
        - generate_query
      agents:
        - validate_query_agent
      inputs:
        - user_natural_language_query
        - country_table_metadata
        - generated_query
      outputs:
        - query_validation_status
        - validated_query
        - query_validation_message

    - name: execute_query
      execution: sequential
      depends_on:
        - validate_query
      agents:
        - query_execution_agent
      inputs:
        - query_validation_status
        - validated_query
        - query_validation_message
      outputs:
        - query_execution_status
        - query_results
        - query_execution_error

    - name: generate_response
      execution: sequential
      depends_on:
        - execute_query
      agents:
        - response_generator_agent
      inputs:
        - user_natural_language_query
        - validated_query
        - query_validation_status
        - query_validation_message
        - query_execution_status
        - query_results
        - query_execution_error
      outputs:
        - request
        - query
        - status
        - response
