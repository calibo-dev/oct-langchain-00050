workflow:
  name: langchain_python_template
  execution: sequential
  inputs:
    - topic
  stages:
    - name: content_drafting_agent
      execution: sequential
      depends_on: []
      agents:
        - content_drafting_agent
      inputs:
        - topic
      outputs:
        - draft

    - name: content_review_agent
      execution: sequential
      depends_on:
        - content_drafting_agent
      agents:
        - content_review_agent
      inputs:
        - topic
        - draft
      outputs:
        - final_response
