workflow:
  name: langchain_python_template
  execution: sequential
  inputs:
    - topic
  stages:
    - name: retrieve_snowflake_data
      execution: sequential
      depends_on: []
      agents:
        - snowflake_data_agent
      inputs:
        - topic
      outputs:
        - data_findings

    - name: summarize_snowflake_data
      execution: sequential
      depends_on:
        - retrieve_snowflake_data
      agents:
        - snowflake_answer_agent
      inputs:
        - topic
        - data_findings
      outputs:
        - final_response
